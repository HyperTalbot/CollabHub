# nginx.conf
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    types_hash_max_size 4096;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 90;
        server_name localhost;

        client_max_body_size 100M;

        # Frontend (Next.js)
        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Auth Service
        location /api/v1/auth/ {
            proxy_pass http://localhost:8080/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Video Service
        location /api/v1/video/ {
            proxy_pass http://localhost:8081/api/v1/video/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Для больших видео файлов
            client_max_body_size 500M;
        }

        # Posts Service
        location /api/v1/posts/ {
            proxy_pass http://localhost:8084/api/v1/posts/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Music Service
        location /api/v1/music/ {
            proxy_pass http://localhost:8085/api/v1/music/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Messenger Service
        location /api/v1/messenger/ {
            proxy_pass http://localhost:8086/api/v1/messenger/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket для Messenger
        location /ws {
            proxy_pass http://localhost:8086/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;

            # ВАЖНО: Не буферизировать WebSocket
            proxy_buffering off;
        }

        # Media Service API (загрузка файлов)
        location /api/v1/media/ {
            proxy_pass http://localhost:8088/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ВАЖНО: Передаем Authorization заголовок
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # Увеличиваем лимиты для загрузки больших файлов
            client_max_body_size 100M;
        }

        # ОПТИМАЛЬНЫЙ ВАРИАНТ: Статические файлы напрямую из папки
        location /uploads/ {
            # ВАЖНО: путь должен заканчиваться на /
            alias /home/yaroslav/Projects/CollabHub/backend/media-service/uploads/;

            # Автоматический индекс директорий (для отладки, потом можно убрать)
            autoindex on;

            # Nginx автоматически определит MIME типы из mime.types
            # Не нужно переопределять

            # Кеширование
            add_header Cache-Control "public, max-age=31536000" always;
            add_header Access-Control-Allow-Origin * always;

            # Логирование для отладки
            access_log /var/log/nginx/access.log;
            error_log /var/log/nginx/error.log;
        }

        # Recommendation Service
        location /api/v1/recommendations/ {
            proxy_pass http://localhost:8089/api/v1/recommendations/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/tracking/ {
            proxy_pass http://localhost:8089/api/v1/tracking/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}






