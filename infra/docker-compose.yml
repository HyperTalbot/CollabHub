# Свой TURN-сервер (coturn). Нужен ТОЛЬКО когда звонок идёт через интернет
# (телефон ↔ телефон за мобильным CGNAT). Для ноут ↔ ноут в одной сети — не нужен.
#
# ⚠️ ВАЖНО: контейнер должен запускаться на СЕРВЕРЕ С ПУБЛИЧНЫМ IP
# (collabhub.cloudpub.ru), а НЕ на ноутбуке за хотспотом телефона.
# За хотспотом (Yota) у ноутбука публичного IP нет вообще — TURN не будет
# доступен извне, сколько портов ни пробрасывай.
#
# Запуск (на сервере):  docker compose -f infra/docker-compose.yml up -d
# Порты наружу: 3478/udp и 49152-49200/udp. TLS отключён → работает только turn:.

services:
  coturn:
    image: coturn/coturn:4.6.2
    container_name: coturn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --realm=collabhub.cloudpub.ru
      - --listening-ip=0.0.0.0
      - --listening-port=3478
      - --external-ip=${TURN_EXTERNAL_IP}
      - --min-port=49152
      - --max-port=49252
      - --user=collabhub:${TURN_PASSWORD}
      - --fingerprint
      - --no-multicast-peers
      - --no-cli